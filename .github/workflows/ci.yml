# CI (ARCHITECTURE §3 release flow step 1, ARCHITECTURE_OPS §15): ruff, the web build (tsc + vite) before pytest,
# vitest, the contract types --check, pytest in mock and replay only (tests/conftest.py blocks the network), and
# gitleaks with the repo's LLM_ key rule. Costs $0 and needs no secret: GitHub never holds a Meta, Twilio or ElevenLabs
# credential.
name: ci

on:
  push:
    branches: [main, "wip/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: lint, web build, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: src/web/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('src/web/package-lock.json') }}

      - name: Install web dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm --prefix src/web ci --no-audit --no-fund

      - name: Web build (tsc + vite), before pytest
        run: npm --prefix src/web run build

      - name: Vitest
        run: npm --prefix src/web test

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Ruff
        run: .venv/bin/ruff check src tests scripts

      - name: Contract types up to date
        run: .venv/bin/python scripts/gen_ts_contracts.py --check

      - name: Pytest (mock and replay only)
        run: .venv/bin/python -m pytest

  gitleaks:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
