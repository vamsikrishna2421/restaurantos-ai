# Fly.io staging app (ARCHITECTURE §3): same image and layout as prod, its own volume, ledger and caps. The app is
# admin-only (every route but /api/health needs ros_admin) and judge mode is off; both follow from
# RESTOS_ENVIRONMENT=staging.
#
# `scripts/deploy.sh staging` builds the image here first; prod then promotes that exact image.
# First setup: `scripts/deploy.sh init staging`. For the load test, switch [[vm]] to the prod class (shared-cpu-2x, 2gb).
app = "restaurantos-staging"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  RESTOS_ENVIRONMENT = "staging"
  RESTOS_AI_MODE = "live"
  RESTOS_DAILY_USD_CAP = "3"
  RESTOS_TOTAL_USD_CAP = "10"
  RESTOS_PUBLIC_BASE_URL = "https://restaurantos-staging.fly.dev"
  RESTOS_DATA_DIR = "/data"
  RESTOS_HOST = "0.0.0.0"
  RESTOS_PORT = "8000"
  RESTOS_KEY_FILES = "false"
  RESTOS_BEHIND_PROXY = "fly"
  FORWARDED_ALLOW_IPS = "*"

[[mounts]]
  source = "ros_data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
