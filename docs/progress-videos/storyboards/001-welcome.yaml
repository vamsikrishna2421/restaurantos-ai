      - Filming · Nov 1, and submission · Nov 4
    say: >-
      Next come the proof and status pages, more safety tests, and the feature freeze on October thirty-first. Then
      we film on November first, and submit on November fourth. I'll make a short video like this one every time
      something new is ready, and the status dashboard always shows the full picture. Thanks for watching!
