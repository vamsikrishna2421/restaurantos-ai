        chip: Working
        state: done
      - text: More than 1,500 automatic checks run and pass
        chip: Tested
        state: done
      - text: The new look, with your hat logo and banner
        chip: Done today
        state: done
      - text: Phone ordering line
        sub: Needs a paid ElevenLabs voice
        chip: Waiting on you
        state: you
      - text: A public website for the judges
        sub: Needs a Fly.io account by Oct 31
        chip: Waiting on you
        state: you
    say: >-
      Here is where things stand. Ordering, the kitchen display, inventory, the AI manager and the judge page all
      work today, and more than fifteen hundred automatic checks pass. The new look with your hat logo is done. Two
      things are waiting on you. The phone line needs a paid ElevenLabs voice. And the public website for judges
      needs a Fly account, by October thirty-first.

  - type: steps
    heading: How to try it yourself
    items:
      - Open the dev link (it runs on your laptop)
      - Click "Run the full story live" and watch
      - Approve the AI's plan when it asks
      - Open the kitchen display or the kiosk from the links under the story
    say: >-
      To try it yourself: open the dev link. Click Run the full story live, and watch. When the AI asks, approve
      its plan. Then open the kitchen display or the kiosk from the links under the story.

  - type: bullets
