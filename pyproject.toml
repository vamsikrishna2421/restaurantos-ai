[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurantos"
version = "0.1.0"
description = "RestaurantOS AI — the AI General Manager for restaurants, built on Meta's Model API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "httpx>=0.28",
  "websockets>=17",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "sqlalchemy[asyncio]>=2.1",
  "aiosqlite>=0.22",
  "numpy>=2.5",
  "python-multipart>=0.0.32",
  "pyyaml>=6",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "pytest-socket", "ruff>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["restaurantos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
