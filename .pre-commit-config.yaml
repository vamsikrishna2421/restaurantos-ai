# Pre-commit hooks for the lead's commits (ARCHITECTURE_OPS §13): gitleaks with .gitleaks.toml (the LLM_ key rule),
# ruff, and a hard stop on the credential files by name.
#
# Install once: `pipx install pre-commit && pre-commit install` (or `.venv/bin/pip install pre-commit`).
# The gitleaks hook builds with Go; without Go, `brew install gitleaks` and change its id to gitleaks-system.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--force-exclude]

  - repo: local
    hooks:
      - id: no-credential-files
        name: credential files stay out of git
        language: fail
        entry: "credential files are gitignored and must never be committed:"
        files: '(^|/)(meta_muse_api_key|twilio_credentials|elevenlabs_api_key|fly_token|[^/]*_credentials|\.env(\.[^/]*)?)$'
        exclude: '(^|/)\.env\.example$'
