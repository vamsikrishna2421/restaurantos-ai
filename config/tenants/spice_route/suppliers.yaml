# Spice Route suppliers (CONTRACTS_SEED §9). All suppliers are labelled samples; POs go to the in-app sandbox
# supplier inbox only, never to a real business.
#
# lead_min is the same-day lead when ordered before cutoff_local (business time); next_day_local is the next-day
# delivery time, null for the staff pickup. Catalog: pack_qty in the ingredient's unit -> pack_price_cents.
# notes stay empty here: a scenario may add supplier_seed notes (dinner_rush adds one to SUP_PATEL).
suppliers:
  - id: SUP_PATEL
    name: Patel Cash & Carry (sample, staff pickup)
    kind: pickup
    lead_min: 40
    cutoff_local: "21:00"
    next_day_local: null
    min_order_cents: 0
    catalog:
      - {ingredient_id: ING_PANEER, pack_qty: 1000, pack_price_cents: 1100}
      - {ingredient_id: ING_CASHEW, pack_qty: 500, pack_price_cents: 900}
      - {ingredient_id: ING_YOGURT, pack_qty: 2000, pack_price_cents: 650}
      - {ingredient_id: ING_MIXED_VEG, pack_qty: 2000, pack_price_cents: 700}
