# Tamil phrase templates (CONTRACTS_SEED §13), native script. Owned by P14; loaded by restaurantos.orders.templates.
#
# UNREVIEWED DRAFT: no fluent Tamil speaker has checked these yet (founders or consenting friends review them
# Oct 27-28). Until review_status is `reviewed` and "ta" is in settings.speak_languages, the system understands Tamil
# (and Tamil-English) but replies in English. Same keys and slots as en.yaml. Per CONTRACTS_SEED §13, numbers and
# money stay in English inside the Tamil line (`numbers: en`); dish and modifier names come from the menu's Tamil
# script names. The bake-off (G4) may flip native script vs romanized for TTS.
lang: ta
review_status: unreviewed
reviewer: null

words:
  numbers: en
  list_sep: ", "
  list_and: " மற்றும் "
  list_or: " அல்லது "
  item: "{qty} {name}"
  item_mods: "{qty} {name} ({mods})"
  mods_sep: ", "
  lowercase_modifiers: false
  money: "{dollars} {cents}"
  dollar: [dollar, dollars]
  cent: [cent, cents]
  allergens:
    dairy: பால் பொருட்கள்
    tree_nuts: முந்திரி போன்ற கொட்டைகள்
    peanuts: வேர்க்கடலை
    gluten: குளுட்டன்
    egg: முட்டை
    soy: சோயா
    sesame: எள்
    mustard: கடுகு
    fish: மீன்
    shellfish: இறால் போன்ற கடல் உணவு
  spice: [காரம் இல்லை, லேசான காரம், நடுத்தர காரம், அதிக காரம்]

templates:
  greet_phone: "வணக்கம், ஸ்பைஸ் ரூட்டை அழைத்ததற்கு நன்றி. நான் ஒரு டெமோ லைனில் உள்ள AI ஆர்டர் உதவியாளர் — உண்மையில் உணவு தயாரிக்கப்படாது. உங்களுக்கு என்ன வேண்டும்?"
  greet_kiosk: "வணக்கம்! பட்டனை அழுத்திப் பிடித்து உங்கள் ஆர்டரைச் சொல்லுங்கள் — ஆங்கிலம், தெலுங்கு, தமிழ் அல்லது ஸ்பானிஷில்."
  backchannel: "ம்ம்…"  # never a lexicon control word (சரி is "yes"): its echo must not confirm a read-back
  ack_added: "{items}. வேறு ஏதாவது வேண்டுமா?"
  readback: "{items}. மொத்தம் {total}, சுமார் {minutes} நிமிடங்கள். ஆமாம் என்று சொல்லுங்கள் அல்லது 1 அழுத்துங்கள்."
  one_moment: "ஒரு நிமிடம்…"
  confirm_reprompt: "ஆர்டர் செய்ய ஆமாம் என்று சொல்லுங்கள் அல்லது 1 அழுத்துங்கள்; மாற்ற இல்லை என்று சொல்லுங்கள் அல்லது 2 அழுத்துங்கள்."
  change_prompt: "சரி — எதை மாற்ற வேண்டும்?"
  placed_phone: "முடிந்தது — உங்கள் ஆர்டர் எண் {order_no}. சுமார் {minutes} நிமிடங்களில் தயாராகும். நன்றி, வணக்கம்!"
  placed_kiosk: "ஆர்டர் {order_no} செய்யப்பட்டது — சுமார் {minutes} நிமிடங்களில் தயாராகும்."
  sold_out_offer: "மன்னிக்கவும், இன்று {item} தீர்ந்துவிட்டது. அதற்கு பதிலாக {alt1} அல்லது {alt2} வேண்டுமா?"
  sold_out_no_alt: "மன்னிக்கவும், இன்று {item} தீர்ந்துவிட்டது. வேறு ஏதாவது வேண்டுமா?"
  clarify_item: "{candidates} — இதில் எது வேண்டும்?"
  clarify_qty: "{item} எத்தனை வேண்டும்?"
  allergen_listed: "எங்கள் {item} செய்முறையில் {allergens} உள்ளன. உங்களுக்கு ஏதேனும் ஒவ்வாமை இருந்தால் தயவுசெய்து எங்கள் ஊழியர்களிடம் சொல்லுங்கள்."
  allergen_not_listed: "எங்கள் {item} செய்முறையில் {allergen} இல்லை, ஆனால் எங்கள் சமையலறையில் அது பயன்படுத்தப்படுகிறது — உங்களுக்கு ஏதேனும் ஒவ்வாமை இருந்தால் தயவுசெய்து எங்கள் ஊழியர்களிடம் சொல்லுங்கள்."
  price_answer: "{item} விலை {price}."
  wait_answer: "இப்போது புதிய ஆர்டர்கள் சுமார் {minutes} நிமிடங்களில் தயாராகின்றன."
  hours_answer: "நாங்கள் காலை 11 மணி முதல் இரவு 10 மணி வரை திறந்திருக்கிறோம் — இது ஒரு மாதிரி உணவகம்."
  qty_flagged: "{qty} {item} சேர்த்துள்ளேன், எங்கள் ஊழியர்கள் உறுதிப்படுத்தக் குறித்து வைத்துள்ளேன்."
  large_order_handoff: "இவ்வளவு பெரிய ஆர்டருக்கு உங்களை எங்கள் ஊழியர்களிடம் ஒப்படைக்கிறேன். நீங்கள் {url} இல் ஆர்டர் செய்யலாம்."
  injection_refusal: "உங்கள் ஆர்டருக்கு மட்டுமே என்னால் உதவ முடியும். உங்களுக்கு என்ன வேண்டும்?"
  didnt_catch: "மன்னிக்கவும், எனக்குப் புரியவில்லை. மீண்டும் சொல்ல முடியுமா?"
  silence_reprompt: "நீங்கள் இன்னும் லைனில் இருக்கிறீர்களா? என்ன ஆர்டர் செய்ய விரும்புகிறீர்கள்?"
  handoff: "இதை எங்கள் ஊழியர்களுக்குத் தெரிவித்துள்ளேன். நீங்கள் {url} இல் ஆர்டர் செய்யலாம்."
  wrap_up: "இந்த டெமோ அழைப்பின் நேரம் கிட்டத்தட்ட முடிந்துவிட்டது — உங்கள் ஆர்டரை இப்போதே செய்யட்டுமா?"
  busy: "எங்கள் டெமோ லைன்கள் அனைத்தும் பிஸியாக உள்ளன. தயவுசெய்து {url} இல் வெப் டெமோவை முயற்சிக்கவும். நன்றி, வணக்கம்!"
  public_busy: "எங்கள் பொது டெமோ லைன்கள் இப்போது பிஸியாக உள்ளன. உங்களிடம் டெமோ குறியீடு இருந்தால், பவுண்ட் அழுத்தி இப்போதே உள்ளிடுங்கள்."
  degraded_phone: "மன்னிக்கவும், எங்கள் ஆர்டர் உதவியாளருக்கு இப்போது சிக்கல் உள்ளது. தயவுசெய்து {url} இல் வெப் டெமோவை முயற்சிக்கவும். நன்றி, வணக்கம்!"
  degraded_one_item: "ஒவ்வொரு உணவாக எடுத்துக்கொள்வோம். உணவின் பெயரைச் சொல்லி, சேர்க்க 1 அழுத்துங்கள்."
  dtmf_bound: "உங்கள் டெமோ சமையலறையுடன் இணைக்கப்பட்டுள்ளீர்கள். உங்களுக்கு என்ன வேண்டும்?"
  dtmf_unknown: "அந்த டெமோ குறியீட்டைக் கண்டுபிடிக்க முடியவில்லை, எனவே இந்த ஆர்டர் பொது பலகைக்குச் செல்லும்."
  cancel_ack: "சரி, அந்த ஆர்டரை ரத்து செய்துவிட்டேன்."
  goodbye: "அழைத்ததற்கு நன்றி. வணக்கம்!"
  notify_default: "{station}: {ingredient} குறைவாக உள்ளது — திறந்த டிக்கெட்டுகளுக்கு முன்னுரிமை கொடுங்கள்; {action}."
  notify_action: "{station}: {ingredient} குறைவு. {actions}. {deadline}"
  items_prefix: "{items}."
  sold_out_offer_one: "மன்னிக்கவும், இன்று {item} தீர்ந்துவிட்டது. அதற்கு பதிலாக {alt1} வேண்டுமா?"
  allergen_none_listed: "எங்கள் {item} செய்முறையில் பொதுவான ஒவ்வாமைப் பொருட்கள் எதுவும் இல்லை, ஆனால் எங்கள் சமையலறையில் அவை பயன்படுத்தப்படுகின்றன — உங்களுக்கு ஏதேனும் ஒவ்வாமை இருந்தால் தயவுசெய்து எங்கள் ஊழியர்களிடம் சொல்லுங்கள்."
  allergen_which_dish: "எந்த உணவைப் பற்றித் தெரிந்துகொள்ள வேண்டும்? உங்களுக்கு ஏதேனும் ஒவ்வாமை இருந்தால் தயவுசெய்து எங்கள் ஊழியர்களிடம் சொல்லுங்கள்."
  which_dish: "எந்த உணவைப் பற்றித் தெரிந்துகொள்ள வேண்டும்?"
  spice_answer: "{item} — {spice}."
  menu_answer: "எங்களிடம் பிரியாணி, குழம்புகள், ஸ்டார்ட்டர்கள், தோசை மற்றும் இட்லி, ரொட்டிகள், பானங்கள் மற்றும் இனிப்புகள் உள்ளன. உங்களுக்கு என்ன வேண்டும்?"
  question_staff: "அதைப் பற்றி பிக்கப் செய்யும்போது எங்கள் ஊழியர்கள் உதவுவார்கள். என்ன ஆர்டர் செய்ய விரும்புகிறீர்கள்?"
  smalltalk: "மகிழ்ச்சியுடன் உதவுகிறேன்! என்ன ஆர்டர் செய்ய விரும்புகிறீர்கள்?"
  off_topic: "மன்னிக்கவும், இங்கே உணவு ஆர்டர்களை மட்டுமே எடுக்க முடியும். உங்களுக்கு என்ன வேண்டும்?"
  what_else: "சரி — உங்களுக்கு என்ன வேண்டும்?"
  nothing_ordered: "நீங்கள் இன்னும் எதுவும் ஆர்டர் செய்யவில்லை. உங்களுக்கு என்ன வேண்டும்?"
  cart_empty: "சரி, உங்கள் ஆர்டர் இப்போது காலியாக உள்ளது. உங்களுக்கு என்ன வேண்டும்?"
  buttons_offer: "மன்னிக்கவும், எனக்குச் சரியாகப் புரியவில்லை. திரையில் உள்ள உணவுகளைத் தொடுங்கள், அல்லது உங்கள் ஆர்டரை டைப் செய்யுங்கள்."
  goodbye_kiosk: "ஆர்டர் செய்ததற்கு நன்றி. உணவை ரசியுங்கள்!"
